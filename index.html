<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/restaurant-order-web-deploy/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="order_web">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>order_web</title>
  <link rel="manifest" href="manifest.json">

    <style>
        /* 1. Full-screen Overlay & Gradient Background */
        #loading_overlay {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          display: flex; /* Use Flexbox for centering */
          justify-content: center;
          align-items: center;
          z-index: 9999; /* Ensure it covers everything */
          /* Apply the specified Linear Gradient */
          background: linear-gradient(
            to bottom center,
            #FFF0E0,
            #000000,
          );
        }

        /* 2. Circular Loader Styles */
        .loader {
          border: 6px solid #FFF0E0; /* Light gray border for background */
          border-top: 6px solid #FF8C00; /* Bright blue color for the spinner part (can be any color) */
          border-radius: 50%;
          width: 50px;
          height: 50px;
          animation: spin 1s linear infinite; /* Apply the animation */
        }

        /* 3. Keyframe Animation for Spinning */
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading_overlay">
      <div class="loader"></div>
    </div>
  <script src="flutter_bootstrap.js" async></script>

  <script>
    window.addEventListener('load', function () {
      // This listener waits for the first frame to render.
      window.addEventListener('flutter-first-frame', function () {
        const loader = document.getElementById('loading_overlay');
        if (loader) {
          // Option 1: Hide it quickly
          // loader.style.display = 'none';

          // Option 2: Fade it out smoothly
          loader.style.transition = 'opacity 0.5s';
          loader.style.opacity = '0';

          // Remove the element completely after the fade-out transition
          setTimeout(() => {
            loader.remove();
          }, 500); // Match the transition duration
        }
      });
    });
  </script>
</body>
</html>
